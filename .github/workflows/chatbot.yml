name: Deploy chatbot

# Deploys the site assistant Worker (chatbot/) and re-crawls every bot in
# chatbot/bots.json, so answers follow site changes: after each site deploy,
# when the chatbot changes, and daily for the other sites it serves.
# Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository
# secrets are set.

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  push:
    branches: [main]
    paths: ["chatbot/**"]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatbot
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot
    steps:
      - name: Check for Cloudflare credentials
        id: cf
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "enabled=$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.cf.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - if: steps.cf.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatbot/package-lock.json

      - if: steps.cf.outputs.enabled == 'true'
        run: npm ci

      - name: Deploy Worker and re-crawl sites
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy && npm run crawl -- --remote
